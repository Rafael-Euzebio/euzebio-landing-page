<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">A rede que sustenta uma venda</title>
  <desc id="desc">Três terminais dependem da rede local para alcançar o mesmo endereço do servidor, que executa o sistema e seu banco de dados.</desc>
  <rect width="720" height="520" fill="#1E242C"/>
  <g fill="none" stroke="#FAF6F0" stroke-width="2">
    <rect x="220" y="46" width="280" height="120" rx="6"/>
    <path d="M360 166v68M144 330v-50h432v50M360 280v50"/>
    <rect x="244" y="234" width="232" height="46" rx="4" fill="#3E5A4B"/>
    <rect x="64" y="330" width="160" height="94" rx="4"/>
    <rect x="280" y="330" width="160" height="94" rx="4"/>
    <rect x="496" y="330" width="160" height="94" rx="4"/>
    <path d="M112 438h64M328 438h64M544 438h64"/>
  </g>
  <g fill="#FAF6F0" font-family="sans-serif" text-anchor="middle">
    <text x="360" y="88" font-size="28">Servidor local</text>
    <text x="360" y="126" font-size="19">Sistema + banco de dados</text>
    <text x="360" y="264" font-size="23">Rede da loja</text>
    <text x="144" y="385" font-size="23">Terminal</text>
    <text x="360" y="385" font-size="23">Terminal</text>
    <text x="576" y="385" font-size="23">Terminal</text>
    <text x="360" y="490" font-size="19">O endereço do servidor conecta toda a operação.</text>
  </g>
</svg>
